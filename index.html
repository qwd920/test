<script type="module">
/* ============================================================
   0. 工具与状态
   ============================================================ */
const $ = id => document.getElementById(id);
const KEYS = ['fame', 'power', 'people', 'clique'];
const CN = { fame:'声望', power:'兵权', people:'民心', clique:'派系' };
const pick = a => a[Math.floor(Math.random() * a.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const SURNAMES = ['张','王','李','刘','陈','杨','黄','赵','周','吴','徐','孙','马','朱','胡','郭','何','高','林','罗','郑','梁','谢','宋','唐','许','韩','冯','邓','曹','彭','曾','萧','田','董','袁','潘','于','蔡','余','杜','叶','程','苏','魏','吕','丁','任','沈'];
const GIVEN = ['慕远','砚秋','仲卿','伯衡','季常','志清','克强','济民','绍武','振邦','云卿','少白','仲元','叔平','景明','耀庭','子昂','世昌','汉卿','梦熊','守义','允恭','文渊','雨农','仲甫','默存','雪松','清源','伯韬','季陶','子文','铁生','健侯','啸天','沛霖','怀瑾','慕韩','汝舟','星槎'];
const NPC_ROLES = ['参谋长','副官','老同学','旧部','同乡','幕僚','政敌','报馆主笔','商会会长','督军代表','党部要员','洋行买办'];
const randomName = () => pick(SURNAMES) + pick(GIVEN);
const randomNPC = () => pick(SURNAMES) + pick(GIVEN.slice(0, 30)) + '（' + pick(NPC_ROLES) + '）';

const S = {
  name: '', year: 1911,
  fame: 20, power: 15, people: 10, clique: 30,
  flags: [], used: [], ended: false
};

const AI = { engine: null, ready: false, loading: false, generating: false, gaveUp: false };
const context = [];

/* ============================================================
   1. 后台加载模型（权重从本站，wasm 从官方 CDN）
   ============================================================ */
function showProgress() { $('progress').classList.add('show'); }
function hideProgress() { $('progress').classList.remove('show'); }
function showSkip() { $('skipRow').classList.add('show'); }
function hideSkip() { $('skipRow').classList.remove('show'); }

function updateProgress(ratio, text) {
  const p = Math.max(0, Math.min(100, Math.round(ratio * 100)));
  $('progressBar').style.width = p + '%';
  $('progressText').textContent = text || ('加载中 ' + p + '%');
}

function setBadge(text, isAI) {
  const b = $('badge');
  b.textContent = text;
  b.classList.toggle('ai', !!isAI);
}

function giveUpAI(msg) {
  if (AI.gaveUp) return;
  AI.gaveUp = true;
  AI.loading = false;
  hideProgress();
  hideSkip();
  setBadge(msg || '简化模式');
}

$('skipBtn').onclick = () => giveUpAI('已跳过 AI · 使用简化模式');

(async function bootAI() {
  if (!navigator.gpu) {
    setBadge('浏览器不支持 WebGPU · 使用简化模式');
    return;
  }

  AI.loading = true;
  showProgress();
  updateProgress(0, '正在准备加载…');
  showSkip();

  let lastProgress = 0;
  const stallTimer = setInterval(() => {
    if (!AI.loading || AI.ready) return clearInterval(stallTimer);
    if (lastProgress === 0) {
      showSkip();
      updateProgress(0, '网络较慢，可点下方链接直接玩');
    }
  }, 20000);

  try {
    const webllm = await import('https://esm.run/@mlc-ai/web-llm');
    const { CreateMLCEngine, prebuiltAppConfig } = webllm;

    const TARGET = 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC';

    const appConfig = {
      model_list: prebuiltAppConfig.model_list.map(m => {
        if (m.model_id !== TARGET) return m;
        return {
          ...m,
          // 关键：权重从本站加载，wasm 保持默认（官方 CDN）
          model: './models/Qwen2.5-0.5B-Instruct-q4f16_1-MLC'
        };
      })
    };

    AI.engine = await CreateMLCEngine(TARGET, {
      appConfig,
      initProgressCallback: (r) => {
        if (r.progress > lastProgress) lastProgress = r.progress;
        let label = r.text || '加载中…';
        label = label.replace(/Fetching param cache.*?(\d+)%/i, '下载模型权重 $1%');
        label = label.replace(/Loading model from cache.*/i, '从缓存读取…');
        label = label.replace(/Loading model.*/i, '初始化模型…');
        updateProgress(r.progress || 0, label);
      }
    });

    AI.ready = true;
    AI.loading = false;
    clearInterval(stallTimer);
    hideProgress();
    hideSkip();
    setBadge('AI 生成模式 · 已就绪', true);
  } catch (e) {
    console.error('模型加载失败:', e);
    clearInterval(stallTimer);
    giveUpAI('模型加载失败 · 使用简化模式');
  }
})();

/* ============================================================
   2. AI 生成场景
   ============================================================ */
const SYS_PROMPT =
`你是《民国人生模拟器》的游戏主持人。根据玩家处境，写一段剧情，然后给出三个选项。

写作要求：
- 用第二人称"你"
- 剧情 60-100 字，有画面感，自然带出年份与时代气息
- 三个选项各 8-16 字，方向彼此不同
- 严格按下面格式输出，不要任何多余文字：

【剧情】剧情正文。
【1】第一个选项。
【2】第二个选项。
【3】第三个选项。`;

function buildPrompt(playerAction) {
  const recent = context.slice(-2).map((c, i) =>
    `第${i + 1}段：${c.story}\n玩家选择：${c.choice}`
  ).join('\n');

  return [
    `年份：${S.year}年`,
    `当前数值：声望${S.fame} 兵权${S.power} 民心${S.people} 派系${S.clique}`,
    recent ? `前情：\n${recent}` : '',
    `玩家行动：${playerAction}`,
    `请写出下一幕。`
  ].filter(Boolean).join('\n');
}

async function generateScene(playerAction) {
  if (!AI.ready || !AI.engine) return null;

  let buf = '';
  const stream = await AI.engine.chat.completions.create({
    messages: [
      { role: 'system', content: SYS_PROMPT },
      { role: 'user', content: buildPrompt(playerAction) }
    ],
    temperature: 0.85,
    top_p: 0.9,
    max_tokens: 240,
    stream: true
  });

  const storyEl = $('story');
  storyEl.classList.add('thinking');
  storyEl.textContent = '正在推演…';

  for await (const chunk of stream) {
    const delta = chunk.choices?.[0]?.delta?.content || '';
    buf += delta;
    const m = buf.match(/【剧情】([\s\S]*?)(?=【\s*1\s*】|$)/);
    if (m && m[1].trim()) {
      storyEl.classList.remove('thinking');
      storyEl.textContent = m[1].trim();
    }
  }
  storyEl.classList.remove('thinking');
  return parseScene(buf);
}

function parseScene(raw) {
  let story = '';
  let options = [];

  const sm = raw.match(/【剧情】([\s\S]*?)(?=【\s*1\s*】|$)/);
  if (sm) story = sm[1].trim();

  for (let i = 1; i <= 3; i++) {
    const re = new RegExp('【\\s*' + i + '\\s*】([\\s\\S]*?)(?=【\\s*' + (i + 1) + '\\s*】|$)');
    const mm = raw.match(re);
    if (mm && mm[1].trim()) options.push(mm[1].trim());
  }

  if (options.length < 3) {
    const found = [];
    for (const line of raw.split('\n')) {
      const mm = line.match(/^\s*[1-3][.、)．]\s*(.+)$/);
      if (mm) found.push(mm[1].trim());
    }
    if (found.length >= 3) options = found.slice(0, 3);
  }

  while (options.length < 3) {
    options.push(pick(['采取强硬手段，以力破局', '结交各方，寻求外援', '稳固根基，静待时机']));
  }
  options = options.slice(0, 3).map(o => o.replace(/^["'“”]|["'“”]$/g, '').slice(0, 24));

  if (!story) story = raw.replace(/【[^】]*】/g, '').trim().slice(0, 220) || '时局变幻，你必须做出抉择。';
  return { story, options };
}

    { text:'睁一只眼闭一只眼，稳住内部', delta:{clique:10,people:-12,fame:-5}, adv:2 }
  ]
},
{ id:'j_famine', from:1942, to:1944,
  text:'1942年，中原大旱，赤地千里，饥民流离。而军粮征购指标仍层层加码。',
  options:[
    { text:'开仓放粮，减免征购', delta:{people:20,fame:12,power:-10}, adv:2 },
    { text:'照额征粮，先保军队', delta:{power:10,people:-22,fame:-10}, adv:2 }
  ]
},
{ id:'v_win', from:1945, to:1945,
  text:'1945年8月，日本投降。举国欢腾，而你站在权力与命运的十字路口。',
  options:[
    { text:'主张和平建国，与各方共商国是', delta:{people:15,fame:12,clique:-8}, flags:['和平'], adv:1 },
    { text:'抢占接收，扩充实力', delta:{power:15,clique:8,people:-15,fame:-8}, flags:['强硬'], adv:1 }
  ]
},
{ id:'c_battle', from:1947, to:1949,
  text:'战局急转直下。辽沈、淮海、平津——一个个地名变成噩耗传来。',
  options:[
    { text:'亲赴前线，力挽狂澜', delta:{fame:12,power:-8,people:5}, adv:1 },
    { text:'保存实力，准备南撤', delta:{power:8,people:-8,fame:-8}, adv:1 },
    { text:'秘密接触对方，筹划起义', delta:{people:15,fame:5,power:-15,clique:-15}, flags:['起义'], adv:1 }
  ]
},
{ id:'c_final', from:1948, to:1949,
  text:'长江北岸，百万大军云集。南京城内，人心惶惶，达官贵人纷纷南逃。',
  options:[
    { text:'死守南京，与城共存亡', delta:{fame:10,power:-15,people:-5}, adv:1 },
    { text:'退守西南，图谋再起', delta:{power:5,fame:-8,people:-5}, adv:1 },
    { text:'通电下野，出国流亡', delta:{fame:-10,power:-20,people:-5}, flags:['流亡'], adv:1 }
  ]
}
];

const GENERIC = [
{ text:'局势胶着。{npc}来访，带来一笔来路不明的军费，条件是你替他办一件事。',
  options:[
    { text:'答应，收下这笔钱', delta:{power:8,clique:6,people:-8,fame:-5}, adv:2 },
    { text:'拒绝，并留个心眼', delta:{fame:6,people:5,power:-3}, adv:2 }
  ]
},
{ text:'你的辖区闹了水灾。赈济要钱，修堤也要钱，而账上已经见底。',
  options:[
    { text:'挪用军费赈灾', delta:{people:15,fame:10,power:-10}, adv:2 },
    { text:'先保军队，灾民自想办法', delta:{power:6,people:-15,fame:-8}, adv:2 }
  ]
},
{ text:'报馆记者写了一篇对你颇为不利的报道，幕僚建议查封报馆。',
  options:[
    { text:'查封报馆，抓人问罪', delta:{power:6,people:-12,fame:-8}, adv:2 },
    { text:'约见主笔，好言安抚', delta:{fame:8,people:10,power:-3}, adv:2 },
    { text:'不理不睬，任其自生自灭', delta:{fame:-3,people:-3}, adv:2 }
  ]
},
{ text:'邻省发生兵变，溃兵数千涌入你的防区，烧杀抢掠。',
  options:[
    { text:'武力清剿，一个不留', delta:{power:10,people:-8,fame:3}, adv:2 },
    { text:'招抚收编，编入麾下', delta:{power:12,clique:-5,people:-10}, adv:2 }
  ]
}
];

function eligible() {
  return EVENTS.filter(e =>
    !S.used.includes(e.id) &&
    S.year >= e.from && S.year <= e.to &&
    (!e.cond || e.cond(S))
  );
}

function nextEvent() {
  const pool = eligible();
  if (!pool.length) return pick(GENERIC);
  const soon = pool.filter(e => e.from <= S.year + 1);
  return pick(soon.length ? soon : pool);
}

function renderFallbackScene() {
  const ev = nextEvent();
  if (ev.id) S.used.push(ev.id);
  return {
    story: ev.text.replace(/\{name\}/g, S.name).replace(/\{npc\}/g, randomNPC()),
    options: ev.options.map(o => o.text),
    deltas: ev.options.map(o => o.delta),
    flags: ev.options.map(o => o.flags || []),
    advances: ev.options.map(o => o.adv || 2)
  };
}

/* ============================================================
   4. 数值计算（AI 模式下，从选项文本推）
   ============================================================ */
const KW = {
  power: ['兵','军','战','攻','打','武','枪','炮','部队','嫡系','扩军','出征','征讨','缴械','收编','兵变','强硬','压制','镇压','铁腕'],
  people: ['民','百姓','赈','减','抚','善','士绅','办学','兴修','救灾','水利','赋','税','粮','饥','安抚','缓和','民生'],
  fame: ['名','声','报','舆论','宣言','通电','发表','辞','请缨','演讲','文章','题字','澄清','公开'],
  clique: ['派','系','党','结','盟','拉拢','联合','联络','依附','投','输诚','靠拢','共','周旋','结交']
};

function rollDelta(text) {
  const score = { fame:0, power:0, people:0, clique:0 };
  for (const k of KEYS) {
    for (const w of KW[k]) if (text.includes(w)) score[k] += 3;
  }
  const sorted = KEYS.map(k => ({ k, v: score[k] })).sort((a, b) => b.v - a.v);
  const main = sorted[0].v > 0 ? sorted[0].k : pick(KEYS);
  let sub = sorted[1] && sorted[1].k !== main && sorted[1].v > 0
    ? sorted[1].k : pick(KEYS.filter(k => k !== main));
  const cost = pick(KEYS.filter(k => k !== main));

  const d = { fame:0, power:0, people:0, clique:0 };
  d[main] += 6 + randInt(0, 8);
  if (sub !== main && sub !== cost) d[sub] += 2 + randInt(0, 4);
  d[cost] -= 4 + randInt(0, 8);
  return d;
}

/* ============================================================
   5. 游戏逻辑
   ============================================================ */
function clampAll() { for (const k of KEYS) S[k] = Math.max(0, Math.min(100, Math.round(S[k] || 0))); }

function updateUI() {
  clampAll();
  for (const k of KEYS) {
    $(k + '-num').textContent = S[k];
    $(k + '-bar').style.width = S[k] + '%';
  }
  $('heroName').textContent = S.name;
  $('yearLabel').textContent = S.year + ' 年';
}

function deltaText(d) {
  return KEYS.filter(k => d[k]).map(k => CN[k] + (d[k] > 0 ? '+' : '') + d[k]).join('  ');
}

function applyDelta(d) { for (const k of KEYS) { const v = Number(d[k]); if (!isNaN(v)) S[k] += v; } }

function checkEnding() {
  if (S.year >= 1949) return endingByStats('1949年，大局已定。');
  if (S.power <= 0 && S.fame <= 0) {
    return { title:'【黯然出局】',
      body:'你既无声望，又无兵权，在乱世中彻底失去了立足之地。\n历史的车轮碾过，你只留下一行模糊的注脚。' };
  }
  if (S.people <= 0) {
    return { title:'【民心尽失】',
      body:'民怨沸腾，众叛亲离。一个清晨，你发现卫队已经换上了别人的旗号。\n得民心者得天下，失民心者，连方寸之地也守不住。' };
  }
  return null;
}

function endingByStats(prefix) {
  const { fame, power, people, clique } = S;
  const total = fame + power + people + clique;
  let title, body;

  if (S.flags.includes('起义')) {
    return { title:'【顺时应变结局】',
      body: prefix + '\n\n你选择了顺应大势，率部起义。此后虽不再执掌权柄，却在新的时代里得以善终。\n史书上关于你的那一页，评价意外地温和。' };
  }
  if (S.flags.includes('流亡')) {
    return { title:'【海外流亡结局】',
      body: prefix + '\n\n你登上了南下的飞机，此后半生寓居异国。\n每到夜深，总想起当年长江上的雾。' };
  }

  if (power >= 70 && people >= 70 && fame >= 70) {
    title = '【中兴名臣结局】'; body = '你手握重兵而心系黎庶，声望遍及朝野。\n后人修史，将你与那些力挽狂澜的名字并列。';
  } else if (power >= 70 && people < 30) {
    title = '【铁腕军阀结局】'; body = '你的军队令行禁止，你的防区无人敢犯。\n只是百姓提起你时，眼里只有畏惧，没有敬爱。';
  } else if (fame >= 70 && power < 30) {
    title = '【清流虚位结局】'; body = '你名满天下，却政令不出府门。\n你成了这个时代最体面的摆设。';
  } else if (clique >= 70) {
    title = '【党国柱石结局】'; body = '你在派系经营上登峰造极，人脉遍布朝野。\n只是夜深人静时，你偶尔想不起最初想做什么。';
  } else if (total >= 220) {
    title = '【乱世能臣结局】'; body = '四个维度上你都拿到了不错的分数。不算顶尖，却也稳稳当当地走完了这段乱世。';
  } else if (total <= 100) {
    title = '【碌碌无闻结局】'; body = '几十年过去，你始终站在舞台边缘。\n历史书上不会有你的名字，但你的后代记得你。';
  } else {
    title = '【浮沉半生结局】'; body = '起起落落，几度沉浮。你既没有登顶，也没有坠底。\n这大概就是大多数人的一生。';
  }
  return { title, body: prefix + '\n\n' + body };
}

/* ============================================================
   6. 渲染与推进
   ============================================================ */
let currentOptions = [];

function renderStory(text, thinking) {
  const el = $('story');
  el.textContent = text;
  el.classList.toggle('thinking', !!thinking);
}

function renderOptions(options, deltas, flags, advances) {
  currentOptions = options.map((text, i) => ({
    text,
    delta: deltas ? deltas[i] : rollDelta(text),
    flags: flags ? flags[i] : [],
    adv: advances ? advances[i] : randInt(1, 3)
  }));

  const wrap = $('btn-group');
  wrap.innerHTML = '';
  $('end').textContent = '';
  $('restartBtn').style.display = 'none';

  currentOptions.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    const left = document.createElement('span');
    left.textContent = (i + 1) + '. ' + opt.text;
    const right = document.createElement('span');
    right.className = 'delta';
    right.textContent = deltaText(opt.delta);
    btn.appendChild(left);
    btn.appendChild(right);
    btn.onclick = () => choose(opt);
    wrap.appendChild(btn);
  });
}

async function step(playerAction) {
  if (S.ended) return;

  if (AI.ready && !AI.gaveUp) {
    try {
      const scene = await generateScene(playerAction);
      renderStory(scene.story, false);
      renderOptions(scene.options);
      if (playerAction) {
        context.push({ story: scene.story, choice: playerAction });
        if (context.length > 6) context.shift();
      }
      return;
    } catch (e) {
      console.error('AI 生成失败，转兜底:', e);
      setBadge('AI 异常 · 使用简化模式');
    }
  }

  const scene = renderFallbackScene();
  renderStory(scene.story, false);
  renderOptions(scene.options, scene.deltas, scene.flags, scene.advances);
  if (playerAction) {
    context.push({ story: scene.story, choice: playerAction });
    if (context.length > 6) context.shift();
  }
}

function choose(opt) {
  if (S.ended || AI.generating) return;

  applyDelta(opt.delta);
  if (opt.flags) opt.flags.forEach(f => S.flags.push(f));
  S.year += opt.adv;
  updateUI();

  const ending = checkEnding();
  if (ending) { endGame(ending); return; }

  $('btn-group').innerHTML = '';
  renderStory('正在推演…', true);

  AI.generating = true;
  step(opt.text).finally(() => { AI.generating = false; });
}

function endGame(e) {
  S.ended = true;
  renderStory('—— 终 ——', false);
  $('btn-group').innerHTML = '';
  $('end').textContent = e.title + '\n\n' + e.body;
  $('restartBtn').style.display = 'inline-block';
}

/* ============================================================
   7. 启动
   ============================================================ */
$('startBtn').onclick = () => {
  const input = $('playerName').value.trim();
  S.name = input || randomName();
  $('setup').style.display = 'none';
  $('game').style.display = 'block';
  updateUI();

  if (AI.gaveUp) setBadge('简化模式');
  else if (AI.loading) setBadge('模型加载中 · 先用简化模式');
  else if (AI.ready) setBadge('AI 生成模式 · 已就绪', true);

  renderStory('正在推演…', true);
  AI.generating = true;
  step('【开局】1911年秋，辛亥革命爆发，我（' + S.name + '）正在日本陆军士官学校求学。请从这里开始。')
    .finally(() => { AI.generating = false; });
};

$('restartBtn').onclick = () => location.reload();

updateUI();
</script>
